name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test with pytest
        run: uv run --group test pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Check formatting with ruff
        run: uv run --group lint ruff format --check
      - name: Lint with ruff
        run: uv run --group lint ruff check
      - name: Type-check with mypy
        run: uv run --group lint mypy

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Build sdist and wheel
        run: uv build
      - name: Smoke-test the wheel without setuptools
        run: uv run --isolated --no-project --with dist/*.whl python -c "import propy.PyPro, propy.AAIndex; propy.AAIndex.get('KRIW790103')"
